name: Deploy Pages

# 推送 master 后自动构建并部署到 GitHub Pages，得到一个可直接访问的在线版。
# 依赖两点既有设计：App 用状态导航（无路由，不需要 404 回退），
# vite base 为 './'（相对路径，子目录部署无需改配置）。
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 部署串行，避免并发相互覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 使用 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
