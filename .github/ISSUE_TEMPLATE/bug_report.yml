name: 🐛 功能异常
description: 报告一个错误行为
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: 感谢反馈！请尽量填写完整，能省掉来回确认的时间。

  - type: textarea
    id: what
    attributes:
      label: 问题现象
      description: 具体哪里不对，附上截图更好
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开「备考」页
        2. 设置初赛日期为 …
        3. …
    validations:
      required: true

  - type: textarea
    id: expect
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行环境
      options:
        - 网页（浏览器）
        - Android App
        - iOS App
        - 不确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 浏览器 / 系统版本
      placeholder: 'Chrome 130 / Android 14 / iOS 18'
